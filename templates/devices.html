<!DOCTYPE html>
<html>
<head>
    <title>Devices</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>📡 Active Devices</h2>

    <div class="grid">
        {% for host in hosts %}
        <div class="card">
            <h3>{{ host }}</h3>

            <form action="/scan" method="post">
                <input type="hidden" name="target" value="{{ host }}">

                <select name="mode">
                    <option value="quick">Quick</option>
                    <option value="balanced">Balanced</option>
                    <option value="deep">Deep</option>
                </select>

                <button class="btn">Scan</button>
            </form>
        </div>
        {% endfor %}
    </div>

    <br>
    <a href="/" class="btn-secondary">⬅ Back</a>
</div>

</body>
</html>
